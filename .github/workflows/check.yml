name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check the catalog
        run: python tools/build_index.py --check
      - name: Build the index
        run: python tools/build_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-v1
          path: dist/catalog-v1.json
