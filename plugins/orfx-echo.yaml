summary: Digital, tape and analog echoes, synced to the tempo, with trails.
description: Digital gives clean repeats, tape darkens and saturates them with
  wow and flutter, and analog sounds like a bucket-brigade line. Time in milliseconds
  or note values, filters in the feedback loop, ducking while you play, and repeats
  that ring out on bypass. Time changes never click.
