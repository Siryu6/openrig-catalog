summary: Drop tunings, octaves and momentary dives, with low latency.
description: Shifts the pitch from two octaves down to an octave up in the time
  domain, with a low, fixed latency reported to the host. A Dive toggle glides
  to its own target and back, ready for a momentary footswitch. Mix with a phase-aligned
  dry, and a Tight or Quality mode.
