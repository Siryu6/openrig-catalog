summary: Boost, overdrive, distortion and fuzz, level-matched and anti-aliased.
description: 'Four drive circuits in one plugin, modelled from how they behave:
  a clean boost, a soft op-amp overdrive, a hard-clipping distortion and a fuzz.
  Tone voiced per circuit, bass before the clipping, and level-matched modes.
  Oversampled antiderivative clipping keeps the highs clean.'
