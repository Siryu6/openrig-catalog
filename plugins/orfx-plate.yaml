summary: A dense stereo plate, decay set in seconds, with freeze.
description: A modulated plate reverb with a smooth, dense tail. The decay is
  set in seconds, scaled below and above two crossovers. Pre-delay, a low cut
  and a high cut shape the reverb only. Freeze holds the tail, and the tail rings
  out on bypass.
